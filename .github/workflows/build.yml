name: Build Blademainer Website

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: blademainer/blademainer.github.com
          path: .legacy/site
          persist-credentials: false
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: blademainer-website
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
